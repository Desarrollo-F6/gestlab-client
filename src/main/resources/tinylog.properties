writer1        = console
writer1.level  = info
writer1.format = {date: yyyy-MM-dd HH:mm:ss} {level} [{thread}] {class-name}: {message}

# Log en el perfil del usuario: Program Files no es escribible sin admin.
writer2          = rolling file
writer2.level    = info
writer2.file     = #{user.home}/.gestlab/logs/app_{count}.log
writer2.latest   = #{user.home}/.gestlab/logs/app.log
writer2.policies = startup, size: 10mb
writer2.backups  = 5
writer2.charset  = UTF-8
writer2.format   = {date: yyyy-MM-dd HH:mm:ss.SSS} {level} [{thread}] {class}.{method}(): {message}

writingthread = true
