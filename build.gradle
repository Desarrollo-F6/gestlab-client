plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.f6'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    flatDir {
        dirs 'lib'
    }
}


dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation 'io.socket:socket.io-client:2.0.1'
    implementation 'org.json:json:20210307'

    implementation 'com.machinezoo.sourceafis:sourceafis:3.18.1'

    // Dependencia captahuellas ZKTeco[cite: 14]
    // Si tienes el JAR en la carpeta /lib, Gradle lo detectará por nombre y versión
    implementation 'com.zkteco:zkfinger:2.0'
}

application {
    mainClassName = 'com.f6.Main'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.f6.Main'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Incluir recursos en el JAR
    from {
        fileTree('src/main/resources') {
            include '**/*'
        }
    }
}

// Esto configura la ruta para CUALQUIER forma en la que se ejecute la app desde el IDE o Gradle
tasks.withType(JavaExec) {
    def osName = System.getProperty("os.name").toLowerCase()

    if (osName.contains("linux")) {
        // Obligamos a la JVM a leer las rutas del sistema que acabamos de indexar
        systemProperty "java.library.path", "/usr/lib/x86_64-linux-gnu:/usr/lib"
        environment "LD_LIBRARY_PATH", "/usr/lib/x86_64-linux-gnu:/usr/lib"
    } else {
        systemProperty "java.library.path", file("lib").absolutePath
    }
}

test {
    useJUnitPlatform()
}