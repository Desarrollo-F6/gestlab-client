plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.f6'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'io.socket:socket.io-client:2.0.1'
    implementation 'org.json:json:20210307'

    // Logging
    implementation 'org.tinylog:tinylog-api:2.7.0'
    implementation 'org.tinylog:tinylog-impl:2.7.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.20.0'
    mockitoAgent('org.mockito:mockito-core:5.20.0') { transitive = false }
}

// El cliente se despliega en los laboratorios con Java 8: el bytecode de produccion se mantiene en 8.
tasks.named('compileJava') {
    options.release = 8
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-options'
}

// Los tests solo corren en la maquina de desarrollo/CI (Mockito 5 requiere Java 11+).
tasks.named('compileTestJava') {
    options.release = 17
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.f6.Main'
}

jar {
    manifest {
        attributes('Main-Class': 'com.f6.Main')
    }
}

test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}
